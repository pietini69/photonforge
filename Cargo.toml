[package]
name = "photon_forge"
version = "1.0.0"
edition = "2021"
authors = ["Niko Pietinen"]
description = "PhotonForge – High-performance astrophotography processing, stacking and calibration platform in Rust."

[dependencies]
eframe = "0.31"
rfd = "0.15"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
byteorder = "1.5"
xisf = "0.5.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
